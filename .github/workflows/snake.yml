name: Generate Snake Animation

on:
  schedule: # Har 12 ghante mein chalega
    - cron: "0 */12 * * *"
  workflow_dispatch: # Aap manually bhi chala sakte hain

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: Platane/snk@master
        with:
          github_user_name: MuhammadAhmedStack
          svg_out_path: dist/github-contribution-grid-snake.svg
      - uses: crazy-max/ghaction-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
